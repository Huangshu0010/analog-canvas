name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "plan/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          heavy=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            heavy=false
            while IFS= read -r path; do
              case "$path" in
                docs/*|plan/*|*.md) ;;
                *) heavy=true; break ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" HEAD)
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
      - name: Check test-impact declaration
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          base="$BEFORE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then base="$BASE_SHA"; fi
          node scripts/check-test-impact.mjs --base "$base"
      - name: Check local Markdown links
        run: node scripts/check-markdown-links.mjs

  static:
    name: Static contracts
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: needs.changes.outputs.heavy != 'true'
        run: echo "Documentation-only change; static contracts are unchanged."
      - if: needs.changes.outputs.heavy == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.heavy == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - if: needs.changes.outputs.heavy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: needs.changes.outputs.heavy == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.heavy == 'true'
        run: pnpm ci:static

  unit:
    name: Unit and integration tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: needs.changes.outputs.heavy != 'true'
        run: echo "Documentation-only change; unit contracts are unchanged."
      - if: needs.changes.outputs.heavy == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.heavy == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - if: needs.changes.outputs.heavy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: needs.changes.outputs.heavy == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.heavy == 'true'
        run: pnpm ci:unit

  release:
    name: Release contracts
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - if: needs.changes.outputs.heavy != 'true'
        run: echo "Documentation-only change; release contracts are unchanged."
      - if: needs.changes.outputs.heavy == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.heavy == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - if: needs.changes.outputs.heavy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: needs.changes.outputs.heavy == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.heavy == 'true'
        run: pnpm ci:release

  e2e:
    name: Browser tests (${{ matrix.shard }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1/2
          - 2/2
    steps:
      - if: needs.changes.outputs.heavy != 'true'
        run: echo "Documentation-only change; browser contracts are unchanged."
      - if: needs.changes.outputs.heavy == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.heavy == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - if: needs.changes.outputs.heavy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: needs.changes.outputs.heavy == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.heavy == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: needs.changes.outputs.heavy == 'true'
        run: pnpm ci:e2e -- --shard=${{ matrix.shard }}
