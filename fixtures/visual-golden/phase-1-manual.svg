<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 30 260 260" role="img" aria-labelledby="title" data-style-profile="textbook-monochrome-v1"><title id="title">Rendered Editor Demo</title><rect x="30" y="30" width="260" height="260" fill="#fff"/><style>text{fill:#000;font-family:Georgia,'Times New Roman',serif;font-size:12px}path,polyline,line,circle{vector-effect:non-scaling-stroke}</style><g data-layer="formal"><g data-layer="routes"></g><g data-layer="junctions"></g><g data-layer="symbols"><g data-object-id="M1" data-symbol-id="nmos"><g transform="translate(100 100) rotate(0)"><g fill="none" stroke="#000" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter"><line x1="-30" y1="0" x2="-10" y2="0"/><line x1="-10" y1="-18" x2="-10" y2="18"/><line x1="-3" y1="-16" x2="-3" y2="16"/><line x1="-3" y1="-12" x2="15" y2="-12"/><line x1="15" y1="-30" x2="15" y2="-12"/><line x1="-3" y1="12" x2="15" y2="12"/><line x1="15" y1="12" x2="15" y2="30"/></g></g><text x="100" y="144" text-anchor="middle">M1</text></g><g data-object-id="M2" data-symbol-id="pmos"><g transform="translate(220 100) rotate(0) scale(-1 1)"><g fill="none" stroke="#000" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter"><line x1="-30" y1="0" x2="-10" y2="0"/><line x1="-10" y1="-18" x2="-10" y2="18"/><line x1="-3" y1="-16" x2="-3" y2="16"/><line x1="-3" y1="-12" x2="15" y2="-12"/><line x1="15" y1="-30" x2="15" y2="-12"/><line x1="-3" y1="12" x2="15" y2="12"/><line x1="15" y1="12" x2="15" y2="30"/><circle cx="-6" cy="0" r="3"/></g></g><text x="220" y="144" text-anchor="middle">M2</text></g><g data-object-id="R1" data-symbol-id="resistor"><g transform="translate(160 220) rotate(90)"><g fill="none" stroke="#000" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter"><line x1="-30" y1="0" x2="-20" y2="0"/><polyline points="-20,0 -15,-8 -5,8 5,-8 15,8 20,0"/><line x1="20" y1="0" x2="30" y2="0"/></g></g><text x="160" y="264" text-anchor="middle">R1</text></g></g><g data-layer="ann